<!doctype html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gæt en pris</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd60a;--k:#1a1a1a;--r:#d90429;--w:#fff;--g:#14803c}
*{box-sizing:border-box}
body{margin:0;background:var(--y);color:var(--k);font:18px Figtree,system-ui,sans-serif}
#app{max-width:1150px;margin:auto;padding:14px}
h1,h2,.big,.tag{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1.05}
h1{font-size:2.6em;margin:.2em 0}h2{font-size:1.6em;margin:.2em 0 .4em}.big{font-size:3.2em}
.card{background:var(--w);border:3px solid var(--k);box-shadow:5px 5px 0 var(--k);border-radius:10px;padding:16px;margin:14px 5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:700 1em Figtree,sans-serif;background:var(--r);color:#fff;border:3px solid var(--k);border-radius:10px;padding:12px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--k);display:inline-block;text-decoration:none}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--k)}
button:disabled{opacity:.5}
.s{background:#fff!important;color:var(--k)!important}.d{background:var(--k)!important}
.mini{padding:5px 10px;font-size:.85em;box-shadow:2px 2px 0 var(--k)}
input{font:inherit;width:100%;padding:12px;border:3px solid var(--k);border-radius:10px}
input[type=radio]{width:auto}
select{font:inherit;padding:10px;border:3px solid var(--k);border-radius:10px;background:#fff;max-width:100%}
img.ad{max-width:100%;max-height:62vh;display:block;margin:auto;border:3px solid var(--k);border-radius:8px}
.tag{display:inline-block;background:var(--r);color:#fff;font-size:2.4em;padding:.1em .5em;transform:rotate(-3deg);border-radius:8px;letter-spacing:.08em}
.mut{opacity:.65}.ok{color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #0002;padding:5px 0}
.opt{width:100%;text-align:left;margin:0}.opt img,.o img{max-width:100%;max-height:120px;display:block;margin:6px auto;border-radius:6px}
.sel{outline:5px solid var(--g)}
.stars{font-size:1.3em;letter-spacing:2px;background:linear-gradient(90deg,#f5a300 var(--p),#ccc var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.o{border:3px solid var(--k);border-radius:10px;padding:10px;background:#fff}.o.right{background:#c9f3d8;border-color:var(--g)}
</style></head>
<body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ===== FIREBASE-KONFIGURATION =====
const FB = {
  apiKey: "AIzaSyCoost9WGY16ETSubJSRTbEMqDwEGeWuJM",
  authDomain: "what-might-this-cost.firebaseapp.com",
  databaseURL: "https://what-might-this-cost-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "what-might-this-cost",
  storageBucket: "what-might-this-cost.firebasestorage.app",
  messagingSenderId: "215706728374",
  appId: "1:215706728374:web:f4841f0872bab2c374b317",
  measurementId: "G-DXS64P3T52"
};
// ==================================
firebase.initializeApp(FB);const db=firebase.database(),auth=firebase.auth();let user=null;
const $=s=>document.querySelector(s),app=$('#app'),R=c=>db.ref('rooms/'+c);
let offs=0,tm,offFns=[];
db.ref('.info/serverTimeOffset').on('value',s=>offs=s.val()||0);
const now=()=>Date.now()+offs,L4='ABCD',typ=a=>a.type||'q';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kr=n=>Number(n).toLocaleString('da-DK',{maximumFractionDigits:2})+' kr';
const on=(r,f)=>{r.on('value',f);offFns.push(()=>r.off('value',f))};
const clean=()=>{offFns.forEach(f=>f());offFns=[];clearInterval(tm)};
const B=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
const li=(a,b)=>`<div class=li><span>${a}</span><b>${b}</b></div>`;
const nf=()=>'<div class=card>Kunne ikke finde spillet. <a href="#">Til menu</a></div>';
const qr=(el,t)=>new QRCode(el,{text:t,width:220,height:220});
const clock=(g,x)=>{tm=setInterval(()=>{const s=g(),e=$('#tm');if(e)e.textContent=s.phase==='guess'&&s.end?Math.max(0,Math.ceil((s.end-now())/1000))+' s':'';x&&x(s)},250)};
const mkCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>a[Math.random()*a.length|0]).join('')};
const T=['Har du nogensinde været i en butik?','Det var ikke engang i nærheden 😂','Gættede du med bind for øjnene?','Prøv at tage brillerne på næste gang','Dristigt gæt… og forkert','Tastede du dit telefonnummer?','Kassedamen græder','Selv mormor ville have ramt bedre'];
const taunt=(id,i)=>{let h=0;for(const ch of id+i)h=(h*31+ch.charCodeAt(0))>>>0;return T[h%T.length]};
const og=(o,cr,cn)=>`<div class=g2>${o.map((x,k)=>`<div class="o${cr===k?' right':''}"><b style="font-size:1.6em;font-family:Anton">${L4[k]}</b> ${esc(x.t)}${x.img?`<img src="${x.img}" style="max-height:22vh">`:''}${cn?`<div class=mut>${cn[k]} svar</div>`:''}</div>`).join('')}</div>`;
const bm=()=>'<button id=bm style="margin-top:12px">Tilbage til menu</button>';

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9';document.body.appendChild(c);
 const x=c.getContext('2d'),cols=['#d90429','#ffd60a','#14803c','#1a1a1a','#2b6cff','#ff7a00'];c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,w:8+Math.random()*8,h:5+Math.random()*7,v:2+Math.random()*3.5,s:(Math.random()-.5)*2,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));let t=0;
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s+Math.sin(p.y/30);p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
  if(++t<480)requestAnimationFrame(f);else c.remove()})()}

function rank(ad,gs,pl){const L=Object.keys(pl).map(id=>({id,g:gs&&gs[id]!=null?+gs[id]:null})),out={};
 const a=L.filter(x=>x.g!=null).map(x=>({...x,d:Math.round(Math.abs(x.g-ad.price)*100)/100})).sort((x,y)=>x.d-y.d);let r=0;
 a.forEach((x,k)=>{if(k===0||x.d!==a[k-1].d)r=k;out[x.id]={g:x.g,d:x.d,r:r+1,pts:(ad.pts||[])[r]||0}});
 L.filter(x=>x.g==null).forEach(x=>out[x.id]={r:99,pts:0});return out}
const rankC=(a,gs,pl)=>{const o={};Object.keys(pl).forEach(id=>{const g=gs&&gs[id]!=null?+gs[id]:null,ok=g===a.correct;o[id]=g==null?{pts:0,ok:0}:{g,ok:ok?1:0,pts:ok?(a.pt||0):0}});return o};
const tot=(res,pl)=>{const t={};Object.keys(pl).forEach(id=>t[id]=0);Object.values(res||{}).forEach(r=>r&&Object.entries(r).forEach(([id,v])=>{if(id in t)t[id]+=v.pts||0}));return t};
const stand=(res,pl)=>{const t=tot(res,pl);return Object.entries(pl).map(([id,p])=>({id,name:p.name,t:t[id]})).sort((a,b)=>b.t-a.t||a.name.localeCompare(b.name))};

const sndCache={};
async function loadSound(id){if(!id)return null;if(sndCache[id])return sndCache[id];
 const d=(await db.ref('sounds/'+id+'/data').once('value')).val();if(!d)return null;return sndCache[id]=URL.createObjectURL(await (await fetch(d)).blob())}
function route(){clean();app.oninput=app.onclick=app.onchange=null;const [k,v]=location.hash.slice(1).split('=');
 if(['m','new','saved','start','live','past','sounds','h'].includes(k)&&!user){location.hash='login';return}
 if(k==='login'&&user){location.hash='m';return}
 const F={h:host,v:view,j:join,new:editor,login,m:adminMenu,saved:()=>savedList('edit'),start:()=>savedList('start'),live:()=>roomList('live'),past:()=>roomList('past'),sounds:soundsPage};(F[k]||menu)(v)}
addEventListener('hashchange',route);
auth.onAuthStateChanged(u=>{user=u;route()});

function menu(){app.innerHTML=`<h1>Gæt en pris</h1>
<div class=card><input id=c placeholder="Deltagerkode" maxlength=4 style="text-transform:uppercase"><div class=row style="margin-top:12px"><button id=j>Deltag i spil</button><button class=s id=v>Vis spil</button></div></div>
<div class=card><button id=nw class=d style="width:100%">Menu</button>${user?`<p class=mut>Logget ind som ${esc(user.email)} · <a href="#" id=lo>Log ud</a></p>`:''}</div>`;
 B('nw',()=>location.hash='m');B('lo',e=>{e.preventDefault();auth.signOut()});
 const go=k=>{const c=$('#c').value.trim().toUpperCase();if(c.length===4)location.hash=k+'='+c};B('j',()=>go('j'));B('v',()=>go('v'))}

function login(){app.innerHTML=`<h1>Log ind</h1><p>Kun den, der opretter spil, skal logge ind.</p><div class=card><button id=gg style="width:100%">Log ind med Google</button></div>
<div class=card><input id=em type=email placeholder="Email"><br><br><input id=pw type=password placeholder="Adgangskode"><br><br><button id=lg style="width:100%">Log ind</button><p id=er style="color:var(--r)"></p></div><button class=s onclick="location.hash=''">Tilbage</button>`;
 const er=e=>$('#er').textContent='Kunne ikke logge ind: '+(e.code||e.message);
 B('gg',()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(er));
 B('lg',()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(er))}

// ---------- Opret spil ----------
let draft={title:'',desc:'',ads:[]};const D='10,7,6,5,4,3,2,1';
const NEW={q:()=>({type:'q',img:'',text:'',price:'',pts:D}),c:()=>({type:'c',img:'',text:'',opts:[{t:'',img:''},{t:'',img:''}],correct:0,pt:10}),s:()=>({type:'s',img:'',title:'',text:''})};
const prs=s=>{const a=String(s).split(/[\s,;]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x));return a.length?a:D.split(',').map(Number)};
const resize=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
function chk(){const out=[],e=m=>{alert(m);return null};
 for(const a of draft.ads){const t=typ(a),b={type:t,img:a.img||'',text:a.text||''};
  if(t==='q'){b.price=parseFloat(String(a.price).replace(',','.'));b.pts=prs(a.pts);if(isNaN(b.price))return e('Alle pris-gæt skal have en korrekt pris.')}
  else if(t==='c'){b.opts=a.opts.map(o=>({t:o.t||'',img:o.img||''}));b.correct=+a.correct;b.pt=parseFloat(a.pt);if(isNaN(b.pt))b.pt=10;if(b.opts.some(o=>!o.t&&!o.img))return e('Hver svarmulighed skal have tekst eller billede.')}
  else{b.title=a.title||'';if(!b.title&&!b.text&&!b.img)return e('En slide må ikke være tom.')}
  out.push(b)}
 if(!out.some(a=>a.type!=='s'))return e('Tilføj mindst ét spørgsmål.');return out}
window.mv=(i,d)=>{const A=draft.ads,j=i+d;if(j<0||j>=A.length)return;[A[i],A[j]]=[A[j],A[i]];rd()};
function editor(){
 app.innerHTML=`<h1>Opret spil</h1><div class=card><input id=t placeholder="Titel" value="${esc(draft.title)}"><input id=ds placeholder="Beskrivelse" value="${esc(draft.desc)}" style="margin-top:8px"><p id=rtg class=mut style="margin:10px 0 0">Rating: ${stars(null)}</p></div><div id=ads></div>
 <div class=card><div class=row><label class=btn>＋ Pris-gæt (vælg billeder)<input id=f type=file accept="image/*" multiple hidden></label><button class=s onclick="draft.ads.push(NEW.c());rd()">＋ Valgspørgsmål A–D</button><button class=s onclick="draft.ads.push(NEW.s());rd()">＋ Slide</button></div></div>
 <div class=row><button id=sg>💾 Gem spil</button><button class=s onclick="location.hash='m'">Tilbage</button></div>`;
 const card=(a,i)=>{const t=typ(a),ctl=`<span style="float:right"><button class="s mini" onclick="mv(${i},-1)">▲</button> <button class="s mini" onclick="mv(${i},1)">▼</button> <button class="d mini" onclick="draft.ads.splice(${i},1);rd()">✕</button></span>`,
  im=(o,cur)=>`<label class="btn s mini">${cur?'Skift billede':'＋ Billede'}<input type=file accept="image/*" hidden data-i=${i} data-o=${o}></label>${cur?`<img src="${cur}" style="height:60px;vertical-align:middle;margin-left:8px;border-radius:6px">`:''}`,
  X=(k,ph,v)=>`<input data-i=${i} data-k=${k} placeholder="${ph}" value="${esc(v)}" style="margin-top:8px">`;
  if(t==='s')return `<div class=card><b>Slide</b>${ctl}${X('title','Overskrift',a.title)}${X('text','Tekst (fx: De næste 4 spørgsmål handler om …)',a.text)}<p>${im(-1,a.img)}</p></div>`;
  if(t==='q')return `<div class=card><b>Pris-gæt</b>${ctl}<p>${im(-1,a.img)}</p>${X('text','Valgfri tekst',a.text)}<input data-i=${i} data-k=price type=number step=any inputmode=decimal placeholder="Korrekt pris (kr)" value="${esc(a.price)}" style="margin-top:8px">${X('pts','Point for 1., 2., 3. plads …',a.pts)}</div>`;
  return `<div class=card><b>Valgspørgsmål</b>${ctl}${X('text','Spørgsmål (fx: Hvilken er dyrest?)',a.text)}<p>${im(-1,a.img)} <small class=mut>valgfrit hovedbillede</small></p>
  ${a.opts.map((o,k)=>`<div class=row style="margin-top:8px"><b>${L4[k]}</b><input type=radio name=r${i} data-r=${i} data-o=${k} ${a.correct==k?'checked':''}><input style="flex:1;min-width:120px" data-i=${i} data-k=t data-o=${k} placeholder="Svar ${L4[k]}" value="${esc(o.t)}">${im(k,o.img)}${a.opts.length>2?`<button class="d mini" onclick="draft.ads[${i}].opts.splice(${k},1);draft.ads[${i}].correct=0;rd()">✕</button>`:''}</div>`).join('')}
  <div class=row style="margin-top:8px">${a.opts.length<4?`<button class="s mini" onclick="draft.ads[${i}].opts.push({t:'',img:''});rd()">＋ Svarmulighed</button>`:''}<span class=mut>Cirklen markerer rigtigt svar</span><input data-i=${i} data-k=pt type=number placeholder="Point" value="${esc(a.pt)}" style="width:100px"></div></div>`};
 const draw=window.rd=()=>$('#ads').innerHTML=draft.ads.map(card).join('');draw();
 app.oninput=e=>{const d=e.target.dataset;if(e.target.id==='t'){draft.title=e.target.value;return}if(e.target.id==='ds'){draft.desc=e.target.value;return}if(d.k==null)return;const a=draft.ads[d.i];(d.o!=null?a.opts[d.o]:a)[d.k]=e.target.value};
 app.onchange=async e=>{const el=e.target,d=el.dataset;
  if(el.id==='f'){for(const f of el.files)draft.ads.push({...NEW.q(),img:await resize(f)});el.value='';draw();return}
  if(d.r!=null){draft.ads[d.r].correct=+d.o;return}
  if(el.type==='file'&&el.files[0]){const u=await resize(el.files[0]),a=draft.ads[d.i];if(+d.o<0)a.img=u;else a.opts[d.o].img=u;draw()}};

 B('sg',async()=>{const ti=draft.title.trim(),ds=(draft.desc||'').trim();if(!ti||!ds)return alert('Spillet skal have både en titel og en beskrivelse.');const ads=chk();if(!ads)return;
  const o={title:ti,desc:ds,ads,ts:Date.now()};if(draft.id)await db.ref('saved/'+draft.id).set(o);else await db.ref('saved').push(o);
  draft={title:'',desc:'',ads:[]};alert('Spillet er gemt.');location.hash='m'});
 if(draft.id)db.ref('ratings/'+draft.id).once('value').then(x=>{const e=$('#rtg');if(e)e.innerHTML='Rating: '+stars(x.val())})}

function stars(r){const v=Object.values(r||{}),n=v.length,a=n?v.reduce((x,y)=>x+y,0)/n:0;
 return `<span class=stars style="--p:${a*20}%">★★★★★</span> ${n?`<b>${a.toFixed(1).replace('.',',')}</b> <small class=mut>(${n})</small>`:'<small class=mut>Ikke vurderet endnu</small>'}`}

function adminMenu(){app.innerHTML=`<h1>Menu</h1><div class=card style="display:grid;gap:12px"><button id=a1>Opret spil</button><button id=a2 class=s>Åbn gemte spil</button><button id=a3>Start spil</button><button id=a4 class=s>Igangværende spil</button><button id=a5 class=s>Tidligere spil</button><button id=a6>Lyde</button></div>
<p><button class=s onclick="location.hash=''">Tilbage</button> <span class=mut>${esc(user.email)} · <a href="#" id=lo>Log ud</a></span></p>`;
 B('a1',()=>{draft={title:'',desc:'',ads:[]};location.hash='new'});B('a2',()=>location.hash='saved');B('a3',()=>location.hash='start');B('a4',()=>location.hash='live');B('a5',()=>location.hash='past');B('a6',()=>location.hash='sounds');
 B('lo',e=>{e.preventDefault();location.hash='';auth.signOut()})}

async function startGame(sid,g){let c;do{c=mkCode()}while((await R(c).child('meta').once('value')).exists());
 const meta={title:g.title,desc:g.desc||'',n:g.ads.length,ts:Date.now(),sid};
 await db.ref().update({['rooms/'+c]:{meta,ads:g.ads,st:{phase:'lobby',i:0}},['roomIdx/'+c]:{title:g.title,ts:meta.ts,sid}});location.hash='h='+c}

async function savedList(mode){
 app.innerHTML=`<h1>${mode==='start'?'Start spil':'Gemte spil'}</h1><div id=ls class=card>Henter …</div><button class=s onclick="location.hash='m'">Tilbage</button>`;let v={};
 const draw=async()=>{const [s1,s2]=await Promise.all([db.ref('saved').once('value'),db.ref('ratings').once('value')]);v=s1.val()||{};const rt=s2.val()||{},e=$('#ls');if(!e)return;
  e.innerHTML=Object.keys(v).length?Object.entries(v).sort((a,b)=>b[1].ts-a[1].ts).map(([k,g])=>`<div class=li style="align-items:flex-start"><span><b>${esc(g.title)}</b> <small class=mut>(${g.ads.length} punkter)</small><br><small>${esc(g.desc||'')}</small><br>${stars(rt[k])}</span><span>${mode==='start'?`<button data-st="${k}">▶ Start</button>`:`<button class="s mini" data-ed="${k}">Åbn</button> <button class="s mini" data-dup="${k}">Duplikér</button> <button class="d mini" data-del="${k}">🗑</button>`}</span></div>`).join(''):'Ingen gemte spil endnu'};
 app.onclick=async ev=>{const d=ev.target.dataset;
  if(d.del&&confirm('Slet spillet og dets ratings?')){await db.ref().update({['saved/'+d.del]:null,['ratings/'+d.del]:null});draw()}
  else if(d.ed||d.dup){const k=d.ed||d.dup,g=JSON.parse(JSON.stringify(v[k]));draft={...(d.ed?{id:k}:{}),title:(d.dup?'Kopi af ':'')+g.title,desc:g.desc||'',ads:g.ads.map(a=>typ(a)==='q'?{...a,pts:(a.pts||[]).join(',')}:a)};location.hash='new'}
  else if(d.st){ev.target.disabled=true;await startGame(d.st,v[d.st])}};
 draw()}

async function roomList(mode){
 app.innerHTML=`<h1>${mode==='live'?'Igangværende spil':'Tidligere spil'}</h1><div id=ls class=card>Henter …</div><button class=s onclick="location.hash='m'">Tilbage</button>`;
 const draw=async()=>{const idx=(await db.ref('roomIdx').once('value')).val()||{};
  const rows=await Promise.all(Object.entries(idx).map(async([k,g])=>{const [st,pl,rs]=await Promise.all(['st','players','res'].map(x=>R(k).child(x).once('value').then(z=>z.val()||{})));return{k,g,st,pl,rs}}));
  const L=rows.filter(r=>(r.st.phase==='end')===(mode==='past')).sort((a,b)=>b.g.ts-a.g.ts),e=$('#ls');if(!e)return;

 offFns.push(()=>{mus.pause();jg.pause();btn.remove()});
 const sync=()=>{const ph=st.phase||'lobby';btn.style.display=(au.track||au.jingle)?'block':'none';btn.textContent=!armed?'🔊 Slå lyd til':muted?'🔇 Lyd fra':'🔊 Lyd til';
  if(!armed||muted||!mus.src||ph==='end'){mus.pause();return}mus.volume=ph==='reveal'?.12:.4;mus.play().catch(()=>{})};
 btn.onclick=()=>{if(!armed){armed=1;[mus,jg].forEach(a=>{if(a.src){a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false;sync()}).catch(()=>{a.muted=false})}})}else muted=!muted;sync()};
 on(R(c).child('audio'),async s=>{au=s.val()||{};const [t,j]=await Promise.all([loadSound(au.track),loadSound(au.jingle)]);
  if(t)mus.src=t;else mus.removeAttribute('src');if(j)jg.src=j;else jg.removeAttribute('src');sync()});
 on(R(c).child('st'),s=>{const v=s.val()||{},k=v.phase+':'+v.i;if(v.phase==='reveal'&&k!==lk&&armed&&!muted&&jg.src){jg.currentTime=0;jg.play().catch(()=>{})}lk=k;sync()});
 clock(()=>st)}
</script></body></html>
